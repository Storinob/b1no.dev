<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>b1no</title>
    <style>
        body {
            background-color: #0C161C;
            color: #e6edf3;
            font-family: monospace;
            margin: 0;
            height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
        }

        .tech-top-left {
            position: fixed;
            top: 10px;
            left: 10px;
            font-size: 14px;
            color: rgba(230, 237, 243, 0.5);
            text-transform: lowercase;
            letter-spacing: 1px;
            pointer-events: none;
        }

        .tech-top-right {
            position: fixed;
            top: 10px;
            right: 10px;
            font-size: 14px;
            color: rgba(230, 237, 243, 0.5);
            text-transform: lowercase;
            letter-spacing: 1px;
            pointer-events: none;
        }

        .center-warning {
            position: absolute;
            width: 100%;
            text-align: center;
            font-size: 20px;
            color: rgba(230, 237, 243, 0.7);
            display: none;
            pointer-events: none;
        }

        .main-content {
            padding-left: 40px;
            max-width: 600px;
            display: none;
        }

        .text-small {
            font-size: 14px;
            color: rgba(230, 237, 243, 0.6);
            margin-bottom: 5px;
            text-transform: lowercase;
            letter-spacing: 1px;
        }

        .text-huge-bold {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: -1px;
        }

        .text-description {
            font-size: 16px;
            color: rgba(230, 237, 243, 0.8);
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .social-links {
            font-size: 14px;
            color: rgba(230, 237, 243, 0.4);
            text-transform: lowercase;
            letter-spacing: 1px;
        }

        .social-links a {
            color: rgba(230, 237, 243, 0.7);
            text-decoration: none;
            transition: color 0.2s;
        }

        .social-links a:hover {
            color: #e6edf3;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="tech-top-left">under construction</div>

    <div id="screen-size" class="tech-top-right">...</div>

    <div id="desktop-warning" class="center-warning">under construction, switch to phone look</div>

    <div id="main-content" class="main-content">
        <div class="text-small">b1no</div>
        <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 15px;">
            <img src="pfp.wepb" alt="Bino Avatar" style="width: 70px; height: 70px; border-radius: 50%; object-fit: cover; flex-shrink: 0;">
            <div class="text-huge-bold" style="margin-bottom: 0;">Bino</div>
        </div>
        <div class="text-description">
            small software developer, modder, and system enthusiast from the internet. also a furry.
        </div>
        <div class="social-links">
            <a href="https://github.com/b1no-gh" target="_blank">github</a> | <a href="https://discord.gg/wdt5Ke2Rs8" target="_blank">discord</a>
        </div>
    </div>

    <script>
        function updateLayout() {
            const width = window.innerWidth;
            const sizeIndicator = document.getElementById('screen-size');
            const desktopWarning = document.getElementById('desktop-warning');
            const mainContent = document.getElementById('main-content');
            
            sizeIndicator.innerText = width + "px";
            
            if (width > 768) {
                desktopWarning.style.display = "block";
                mainContent.style.display = "none";
            } else {
                desktopWarning.style.display = "none";
                mainContent.style.display = "block";
            }
        }
        
        updateLayout();
        window.addEventListener('resize', updateLayout);
    </script>
</body>
</html>
