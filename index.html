<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>b1no.dev</title>
    <style>
        body {
            background-color: #0d1117;
            color: #e6edf3;
            font-family: monospace;
            margin: 0;
            height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
        }

        /* --- ТЕХНИЧЕСКАЯ ЛИНИЯ (не учитывается при построении сайта) --- */
        .tech-top-left {
            position: fixed;
            top: 10px;
            left: 10px;
            font-size: 14px;
            color: rgba(230, 237, 243, 0.5);
            text-transform: lowercase;
            letter-spacing: 1px;
            pointer-events: none;
        }

        .tech-top-right {
            position: fixed;
            top: 10px;
            right: 10px;
            font-size: 14px;
            color: rgba(230, 237, 243, 0.5);
            text-transform: lowercase;
            letter-spacing: 1px;
            pointer-events: none;
        }

        /* --- ЦЕНТРАЛЬНЫЙ БЛОК (для ПК-версии) --- */
        .center-warning {
            position: absolute;
            width: 100%;
            text-align: center;
            font-size: 20px;
            color: rgba(230, 237, 243, 0.7);
            display: none; /* по умолчанию скрыто, управляется скриптом */
            pointer-events: none;
        }

        /* --- ОСНОВНОЙ КОНТЕНТ (в левой части) --- */
        .main-content {
            padding-left: 40px;
            max-width: 600px;
        }

        .text-small {
            font-size: 14px;
            color: rgba(230, 237, 243, 0.6);
            margin-bottom: 5px;
            text-transform: lowercase;
            letter-spacing: 1px;
        }

        .text-huge-bold {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: -1px;
        }

        .text-description {
            font-size: 16px;
            color: rgba(230, 237, 243, 0.8);
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <!-- Техническая строка: верхний левый угол -->
    <div class="tech-top-left">under construction</div>

    <!-- Техническая строка: верхний правый угол (размер экрана) -->
    <div id="screen-size" class="tech-top-right">...</div>

    <!-- Сообщение по центру, если открыто не на телефоне -->
    <div id="desktop-warning" class="center-warning">under construction, switch to phone look</div>

    <!-- Основной контент слева -->
    <div class="main-content">
        <div class="text-small">b1no</div>
        <div class="text-huge-bold">Bino</div>
        <div class="text-description">
            custom software developer, script maker & system enthusiast based in poland. building lightweight tools and game modifications.
        </div>
    </div>

    <script>
        function updateLayout() {
            const width = window.innerWidth;
            const sizeIndicator = document.getElementById('screen-size');
            const desktopWarning = document.getElementById('desktop-warning');
            
            // Выводим размер экрана в правый верхний угол
            sizeIndicator.innerText = width + "px";
            
            // Проверяем условие для ПК / телефона (порог 768px)
            if (width > 768) {
                desktopWarning.style.display = "block";
            } else {
                desktopWarning.style.display = "none";
            }
        }
        
        updateLayout();
        window.addEventListener('resize', updateLayout);
    </script>
</body>
    </html>
