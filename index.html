<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Check</title>
    <style>
        body {
            background-color: #0C161C;
            color: #e6edf3;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-size: 24px;
            position: relative;
        }

        .under-construction {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 14px;
            color: rgba(230, 237, 243, 0.5);
            text-transform: lowercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="under-construction">under construction</div>

    <div id="device-indicator">checking...</div>

    <script>
        function checkDevice() {
            const width = window.innerWidth;
            const indicator = document.getElementById('device-indicator');
            
            if (width <= 768) {
                indicator.innerText = "phone (" + width + "px)";
            } else {
                indicator.innerText = "pc (" + width + "px)";
            }
        }
        
        checkDevice();
        window.addEventListener('resize', checkDevice);
    </script>
</body>
</html>
